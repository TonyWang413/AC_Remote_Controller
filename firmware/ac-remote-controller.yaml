esphome:
  name: ac-remote-controller
  friendly_name: AC Remote Controller

esp32:
  board: esp32dev
  framework:
    type: esp-idf

# 啟動藍牙網關功能 (BLE Proxy)，負責接收小米藍牙溫濕度計 3 (MJWSD05MMC) 的廣播訊號
esp32_ble_tracker:
  scan_parameters:
    interval: 320ms
    window: 300ms
    active: true

bluetooth_proxy:
  active: true

# 設定 Wi-Fi 連線 (請至 secrets.yaml 填寫實際的 2.4GHz Wi-Fi 帳號密碼)
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # 若連不上家裡 Wi-Fi，ESP32 會自動開啟此救援熱點
  ap:
    ssid: "AC-Controller-Fallback-AP"

captive_portal:

# 與 Home Assistant 通訊的加密 API
api:
  encryption:
    key: !secret api_encryption_key

# 支援後續透過 Wi-Fi 無線更新韌體 (OTA)
ota:
  - platform: esphome

# 啟用序列埠與無線 Log 輸出
logger:
  level: INFO

# M5Stack U002 紅外線接收器 (連接至 GPIO18)
# U002 內建 38kHz 解調接收器為 Active-Low，因此需設定 inverted: true
remote_receiver:
  id: ir_rx
  pin:
    number: GPIO18
    inverted: true
    mode:
      input: true
      pullup: true
  dump:
    - raw
  idle: 25ms
  rmt_symbols: 256
  filter_symbols: 100
  receive_symbols: 1024

# M5Stack U002 紅外線發射器 (連接至 GPIO19)
remote_transmitter:
  pin: GPIO19
  carrier_duty_percent: 50%
  non_blocking: true
  rmt_symbols: 256

# 從 Home Assistant 同步「小米藍牙溫濕度計 3 (84D3)」的即時溫濕度，供冷氣溫控轉盤顯示 Current 數值
sensor:
  - platform: homeassistant
    id: ac_outlet_temp
    entity_id: sensor.ke_ting_temperature_humidity_sensor_84d3_temperature
    internal: true

  - platform: homeassistant
    id: ac_outlet_humidity
    entity_id: sensor.ke_ting_temperature_humidity_sensor_84d3_humidity
    internal: true

# 日立冷氣 344-bit (HITACHI_AC344) 溫控實體 (Climate)
climate:
  - platform: hitachi_ac344
    id: hitachi_ac
    name: "日立冷氣 (Hitachi AC)"
    receiver_id: ir_rx
    sensor: ac_outlet_temp
    humidity_sensor: ac_outlet_humidity
    supports_cool: true
    supports_heat: true

# 1 小時送風防霉倒數計時腳本 (mode: restart 代表重按會重新計時 60 分鐘)
script:
  - id: fan_1hr_timer
    mode: restart
    then:
      - logger.log: "Starting 60-minute Fan-Only mildew-proof countdown..."
      - delay: 60min
      - logger.log: "60-minute countdown finished! Turning off Hitachi AC..."
      - climate.control:
          id: hitachi_ac
          mode: "OFF"
          fan_mode: "AUTO"
      - switch.turn_off: btn_fan_1hr

# 送風防霉 1 小時自動關機控制開關 (Switch)
switch:
  - platform: template
    name: "送風防霉 1hr 關機 (Fan 1h)"
    id: btn_fan_1hr
    icon: "mdi:fan-clock"
    optimistic: true
    turn_on_action:
      - logger.log: "Switching Hitachi AC to FAN_ONLY mode for 1 hour..."
      - climate.control:
          id: hitachi_ac
          mode: "FAN_ONLY"
          fan_mode: "LOW"
      - script.execute: fan_1hr_timer
    turn_off_action:
      - logger.log: "Stopping 1-hour Fan-Only timer."
      - script.stop: fan_1hr_timer
